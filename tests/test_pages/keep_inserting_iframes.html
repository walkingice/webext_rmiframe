<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Keep Inserting Iframes</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; }
    #iframes { display: grid; gap: 1rem; grid-template-columns: repeat(2, 180px); }
    iframe { border: 0; height: 100px; width: 180px; }
    button { margin-bottom: 1.5rem; }
  </style>
</head>
<body>
  <h1>Keep Inserting Iframes</h1>
  <button id="insert-iframe" type="button">insert iframe</button>
  <div id="iframes" aria-label="iframes"></div>

  <script src="keep_inserting_iframes.js"></script>
</body>
</html>
